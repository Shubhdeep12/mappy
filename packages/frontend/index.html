<!doctype html>
<html lang="en" class="">
  <head>
    <script>
      // Prevent flash of unstyled content - apply theme before render
      const theme = localStorage.getItem('theme') || 'light';
      document.documentElement.classList.toggle('dark', theme === 'dark');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Mappy - AI Scenic Route Planner</title>
    <meta name="title" content="Mappy - AI Scenic Route Planner" />
    <meta name="description" content="Plan beautiful walking, running, and biking routes with AI. Mappy optimizes for scenery, safety, and your favorite destinations." />
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mappy - AI Scenic Route Planner" />
    <meta property="og:description" content="Plan beautiful walking, running, and biking routes with AI. Optimized for scenery, safety, and your favorite destinations." />
    <meta property="og:image" content="/icon-512.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Mappy - AI Scenic Route Planner" />
    <meta property="twitter:description" content="Plan beautiful walking, running, and biking routes with AI. Optimized for scenery, safety, and your favorite destinations." />
    <meta property="twitter:image" content="/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
